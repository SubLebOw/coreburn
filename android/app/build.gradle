apply plugin: 'com.android.application'

// ---------------------------------------------------------------------------
// COREBURN: the AdMob App ID is read from ../js/ads-config.js (the ONE place
// for all ad IDs), so you never have to edit it in two places.
// It goes into AndroidManifest.xml via ${admobAppId}. Changing it needs a new
// Play Store build (it's native config, not game content).
// ---------------------------------------------------------------------------
def readAdmobAppId() {
    def cfg = rootProject.file('../js/ads-config.js')
    def m = (cfg.text =~ /ADMOB_APP_ID_ANDROID\s*:\s*['"]([^'"]+)['"]/)
    if (!m.find()) throw new GradleException("ADMOB_APP_ID_ANDROID not found in js/ads-config.js")
    return m.group(1)
}

// ---------------------------------------------------------------------------
// Release signing. The upload keystore lives OUTSIDE the repo (never commit it!).
// Default location: /home/box/coreburn-keys/keystore.properties
// Override with:  ./gradlew bundleRelease -PcoreburnKeystoreProps=/path/to/keystore.properties
// or the env var COREBURN_KEYSTORE_PROPS. If the file is missing, release builds are unsigned.
// ---------------------------------------------------------------------------
def keystorePropsPath = project.findProperty('coreburnKeystoreProps') ?: System.getenv('COREBURN_KEYSTORE_PROPS') ?: '/home/box/coreburn-keys/keystore.properties'
def keystorePropsFile = file(keystorePropsPath)
def keystoreProps = new Properties()
if (keystorePropsFile.exists()) { keystorePropsFile.withInputStream { keystoreProps.load(it) } }

android {
    namespace = "com.sublebow.coreburn"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "com.sublebow.coreburn"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 1
        versionName "1.0.0"
        // versionCode must go up by 1 for EVERY upload to Google Play.
        manifestPlaceholders = [admobAppId: readAdmobAppId()]
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    signingConfigs {
        release {
            if (keystorePropsFile.exists()) {
                storeFile file(keystoreProps['storeFile'])
                storePassword keystoreProps['storePassword']
                keyAlias keystoreProps['keyAlias']
                keyPassword keystoreProps['keyPassword']
            }
        }
    }
    buildTypes {
        release {
            if (keystorePropsFile.exists()) signingConfig signingConfigs.release
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
